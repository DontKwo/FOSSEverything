name: CI & Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FOSSEverything
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Clone ai-dev-tools
        shell: bash
        run: git clone --depth 1 https://github.com/DontKwo/ai-dev-tools.git "${{ runner.temp }}/_aitools"

      - name: Install Python and Dev Dependencies
        run: uv sync --locked --dev

      - name: Run Strict Linter and Link Check
        shell: bash
        run: |
          if ! uv run --no-project python "${{ runner.temp }}/_aitools/scripts/claudemd_linter.py" . --level strict --full --no-cache; then
            cat "${{ runner.temp }}/_aitools/scripts"/lint_report_*.txt || true
            exit 1
          fi
          uv run --no-project python "${{ runner.temp }}/_aitools/scripts/link_checker.py" .

      - name: Run Unit Test Suite
        run: uv run pytest --ignore=tests/ui -q

      - name: Compute Next SemVer Release Version
        id: ver
        shell: python
        run: |
          import os, re, subprocess
          subprocess.run(["git", "fetch", "--tags", "--force"], check=False)
          raw_tags = subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines()
          semvers = []
          for t in raw_tags:
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)$", t.strip())
              if m:
                  semvers.append(tuple(int(x) for x in m.groups()))
          base = max(semvers) if semvers else (0, 1, 28)
          next_ver = (base[0], base[1], base[2] + 1) if f"v{base[0]}.{base[1]}.{base[2]}" in raw_tags else base
          ver_str = f"{next_ver[0]}.{next_ver[1]}.{next_ver[2]}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={ver_str}\ntag=v{ver_str}\n")
          print(f"Resolved version v{ver_str}")
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

  build-windows:
    needs: lint-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: uv sync --locked --dev

      - name: Run Unit Tests
        run: uv run pytest --ignore=tests/ui -q

      - name: Build Executable and Windows Setup
        run: |
          uv run python scripts/build_executable.py --skip-tests
          .\dist\FOSSEverything\FOSSEverything.exe --self-test
          uv run python scripts/build_installer.py --version=${{ needs.lint-and-test.outputs.version }}
          mkdir -Force release-assets | Out-Null
          Copy-Item installer\Output\FOSSEverything-Setup.exe release-assets\FOSSEverything-Windows.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: release-assets/FOSSEverything-Windows.exe

  build-macos:
    needs: lint-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install Dependencies
        run: uv sync --locked --dev

      - name: Run Unit Tests
        run: uv run pytest --ignore=tests/ui -q

      - name: Build macOS App and DMG
        run: |
          uv run python scripts/build_executable.py --skip-tests
          ./dist/FOSSEverything.app/Contents/MacOS/FOSSEverything --self-test
          mkdir -p release-assets
          hdiutil create -volname "FOSSEverything" -srcfolder dist/FOSSEverything.app -ov -format UDZO release-assets/FOSSEverything-macOS.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: release-assets/FOSSEverything-macOS.dmg

  build-linux:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install System WebKit Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb

      - name: Install Dependencies
        run: uv sync --locked --dev

      - name: Run Unit Tests
        run: uv run pytest --ignore=tests/ui -q

      - name: Build Linux Package and Self-Test
        run: |
          uv run python scripts/build_executable.py --skip-tests
          xvfb-run -a ./dist/FOSSEverything/FOSSEverything --self-test || ./dist/FOSSEverything/FOSSEverything --configure --theme=dark --ui-scale=1.0
          mkdir -p release-assets stage/FOSSEverything
          cp -r dist/FOSSEverything/* stage/FOSSEverything/
          cp installer/install-linux.sh stage/install.sh
          chmod +x stage/install.sh stage/FOSSEverything/FOSSEverything
          tar -czf release-assets/FOSSEverything-Linux.tar.gz -C stage .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: release-assets/FOSSEverything-Linux.tar.gz

  release:
    needs: [lint-and-test, build-windows, build-macos, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect Release Assets
        run: |
          mkdir -p dist-release
          cp artifacts/windows-package/FOSSEverything-Windows.exe dist-release/
          cp artifacts/macos-package/FOSSEverything-macOS.dmg dist-release/
          cp artifacts/linux-package/FOSSEverything-Linux.tar.gz dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.lint-and-test.outputs.tag }}
          name: FOSSEverything ${{ needs.lint-and-test.outputs.tag }}
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            dist-release/FOSSEverything-Windows.exe
            dist-release/FOSSEverything-macOS.dmg
            dist-release/FOSSEverything-Linux.tar.gz
