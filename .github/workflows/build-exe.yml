name: Build Executables & Release Distributables

"on":
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'NOTICES.md'
      - 'PRIVACY.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'NOTICES.md'
      - 'PRIVACY.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - standalone
          - installer
  release:
    types: [ published ]

jobs:
  build-windows:
    name: Build Windows Binary & Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run Test Suite
        run: |
          uv run python -m pytest --ignore=tests/ui -q

      - name: Build Standalone Executable (PyInstaller)
        run: |
          uv run python scripts/build_executable.py

      - name: Compress Standalone Build to ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\FOSSEverything\* -DestinationPath dist\FOSSEverything-Portable-win64.zip -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc installer\FOSSEverything.iss
          } else {
            uv run python scripts/build_installer.py
          }

      - name: Upload Portable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOSSEverything-Portable-win64
          path: dist/FOSSEverything-Portable-win64.zip
          retention-days: 14

      - name: Upload Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOSSEverything-Setup-win64
          path: installer/Output/*.exe
          retention-days: 14

      - name: Attach Windows Assets to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FOSSEverything-Portable-win64.zip
            installer/Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Standalone Binary & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run Test Suite
        run: |
          uv run python -m pytest --ignore=tests/ui -q

      - name: Build Standalone Executable (PyInstaller)
        run: |
          uv run python scripts/build_executable.py

      - name: Prepare Linux Portable Distribution Package
        run: |
          mkdir -p dist/package/FOSSEverything
          cp -r dist/FOSSEverything/* dist/package/FOSSEverything/
          cp assets/icon.png dist/package/FOSSEverything/icon.png 2>/dev/null || cp assets/icon.ico dist/package/FOSSEverything/icon.ico
          if [ -f installer/install-linux.sh ]; then
            cp installer/install-linux.sh dist/package/FOSSEverything/install.sh
            chmod +x dist/package/FOSSEverything/install.sh
          fi
          tar -czf dist/FOSSEverything-Portable-linux64.tar.gz -C dist/package FOSSEverything

      - name: Upload Linux Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOSSEverything-Portable-linux64
          path: dist/FOSSEverything-Portable-linux64.tar.gz
          retention-days: 14

      - name: Attach Linux Assets to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FOSSEverything-Portable-linux64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
