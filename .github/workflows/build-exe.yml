name: Build and Release

"on":
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'NOTICES.md'
      - 'PRIVACY.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'NOTICES.md'
      - 'PRIVACY.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute release version
        id: compute
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE="$(grep -m1 '^version' pyproject.toml | sed -E 's/^version *= *"([0-9]+\.[0-9]+)\..*"/\1/')"
            VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '${VERSION}' must look like MAJOR.MINOR.PATCH (for example 1.2.3)." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${VERSION}"

  build-windows:
    name: Windows (portable ZIP and setup installer)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run test suite
        run: uv run python -m pytest --ignore=tests/ui -q

      - name: Build standalone executable (PyInstaller)
        run: uv run python scripts/build_executable.py --skip-tests

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $settings = Join-Path $env:RUNNER_TEMP "foss-smoke"
          $env:FOSS_SETTINGS_DIR = $settings
          $proc = Start-Process -FilePath "dist\FOSSEverything\FOSSEverything.exe" -ArgumentList "--configure","--theme=light","--ui-scale=1.25" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Frozen exe --configure exited with $($proc.ExitCode)" }
          $json = Get-Content (Join-Path $settings "settings.json") -Raw | ConvertFrom-Json
          if ($json.theme -ne "light" -or [double]$json.ui_scale -ne 1.25) { throw "Unexpected settings: $($json | ConvertTo-Json -Compress)" }

      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\FOSSEverything -DestinationPath dist\FOSSEverything-Portable-win64.zip -Force

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            foreach ($candidate in @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $candidate) { $iscc = $candidate; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=${{ needs.version.outputs.version }}" installer\FOSSEverything.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Silent install, verify, and uninstall the setup installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "FOSSInstall"
          $settingsDir = Join-Path $env:USERPROFILE ".fosseverything"
          if (Test-Path $settingsDir) { Remove-Item $settingsDir -Recurse -Force }
          $setup = (Get-ChildItem installer\Output\FOSSEverything-Setup.exe).FullName
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$installDir`"","/TYPE=full","/TASKS=desktopicon","/Theme=light","/Scale=1.25" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir "FOSSEverything.exe"))) { throw "FOSSEverything.exe missing after install" }
          $json = Get-Content (Join-Path $settingsDir "settings.json") -Raw | ConvertFrom-Json
          if ($json.theme -ne "light" -or [double]$json.ui_scale -ne 1.25) { throw "Installer wizard options were not applied: $($json | ConvertTo-Json -Compress)" }
          $pdfKey = "HKCU:\Software\Classes\.pdf\OpenWithProgids"
          if ((Get-Item $pdfKey -ErrorAction SilentlyContinue).Property -notcontains "FOSSEverything.File") { throw "Open with entry for .pdf was not registered" }
          if (-not (Test-Path -LiteralPath "HKCU:\Software\Classes\*\shell\FOSSEverything")) { throw "Explorer context menu was not registered" }
          $uninstaller = Join-Path $installDir "unins000.exe"
          Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $installDir "FOSSEverything.exe")); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $installDir "FOSSEverything.exe")) { throw "Uninstall left FOSSEverything.exe behind" }
          if ((Get-Item $pdfKey -ErrorAction SilentlyContinue).Property -contains "FOSSEverything.File") { throw "Uninstall left the .pdf Open with entry" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/FOSSEverything-Portable-win64.zip
            installer/Output/FOSSEverything-Setup.exe
          retention-days: 14
          if-no-files-found: error

  build-linux:
    name: Linux (portable tarball)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run test suite
        run: uv run python -m pytest --ignore=tests/ui -q

      - name: Build standalone executable (PyInstaller)
        run: uv run python scripts/build_executable.py --skip-tests

      - name: Package portable tarball
        run: |
          mkdir -p dist/package/FOSSEverything
          cp -r dist/FOSSEverything/* dist/package/FOSSEverything/
          cp assets/icon.png dist/package/FOSSEverything/icon.png
          cp installer/install-linux.sh dist/package/FOSSEverything/install.sh
          chmod +x dist/package/FOSSEverything/install.sh dist/package/FOSSEverything/FOSSEverything
          tar -czf dist/FOSSEverything-Portable-linux64.tar.gz -C dist/package FOSSEverything

      - name: Smoke test tarball installer (install, configure, uninstall)
        run: |
          export FOSS_SETTINGS_DIR="${RUNNER_TEMP}/foss-settings"
          TEST_ROOT="${RUNNER_TEMP}/tarball-test"
          mkdir -p "${TEST_ROOT}"
          tar -xzf dist/FOSSEverything-Portable-linux64.tar.gz -C "${TEST_ROOT}"
          PREFIX="${RUNNER_TEMP}/foss-prefix"
          "${TEST_ROOT}/FOSSEverything/install.sh" --prefix "${PREFIX}" --no-cli-link --theme light --ui-scale 1.25 --yes
          test -x "${PREFIX}/FOSSEverything"
          grep -q '"theme": "light"' "${FOSS_SETTINGS_DIR}/settings.json"
          grep -q '"ui_scale": 1.25' "${FOSS_SETTINGS_DIR}/settings.json"
          "${TEST_ROOT}/FOSSEverything/install.sh" --prefix "${PREFIX}" --uninstall --yes
          test ! -e "${PREFIX}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/FOSSEverything-Portable-linux64.tar.gz
          retention-days: 14
          if-no-files-found: error

  build-macos:
    name: macOS (DMG and portable ZIP)
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run test suite
        run: uv run python -m pytest --ignore=tests/ui -q

      - name: Build standalone application (PyInstaller)
        run: uv run python scripts/build_executable.py --skip-tests

      - name: Smoke test frozen application
        run: |
          export FOSS_SETTINGS_DIR="${RUNNER_TEMP}/foss-settings"
          dist/FOSSEverything.app/Contents/MacOS/FOSSEverything --configure --theme=light --ui-scale=1.25
          grep -q '"theme": "light"' "${FOSS_SETTINGS_DIR}/settings.json"

      - name: Package DMG and ZIP
        run: |
          test -d dist/FOSSEverything.app
          cd dist
          rm -rf dmgroot
          mkdir dmgroot
          cp -R FOSSEverything.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "FOSSEverything" -srcfolder dmgroot -ov -format UDZO FOSSEverything-macos.dmg
          ditto -c -k --sequesterRsrc --keepParent FOSSEverything.app FOSSEverything-Portable-macos.zip

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/FOSSEverything-macos.dmg
            dist/FOSSEverything-Portable-macos.zip
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [ version, build-windows, build-linux, build-macos ]
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Collect release files and checksums
        shell: bash
        run: |
          mkdir release
          find staging -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.dmg' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -l

      - name: Write release notes
        shell: bash
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}"
          cat > notes.md <<EOF
          ## Downloads

          | Platform | Download | Notes |
          |---|---|---|
          | Windows | [FOSSEverything-Setup.exe](${BASE}/FOSSEverything-Setup.exe) | Installer wizard with components, shortcuts, theme, and install folder options |
          | Windows | [FOSSEverything-Portable-win64.zip](${BASE}/FOSSEverything-Portable-win64.zip) | Extract and run \`FOSSEverything.exe\` |
          | macOS | [FOSSEverything-macos.dmg](${BASE}/FOSSEverything-macos.dmg) | Open the DMG and drag the app to Applications |
          | macOS | [FOSSEverything-Portable-macos.zip](${BASE}/FOSSEverything-Portable-macos.zip) | Extract and run \`FOSSEverything.app\` |
          | Linux | [FOSSEverything-Portable-linux64.tar.gz](${BASE}/FOSSEverything-Portable-linux64.tar.gz) | Extract and run \`./install.sh\` (try \`--help\`) |

          Verify downloads with [SHA256SUMS.txt](${BASE}/SHA256SUMS.txt).
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FOSSEverything ${{ needs.version.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          make_latest: true
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
